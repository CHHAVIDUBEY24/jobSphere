spring.application.name=Job Portal System

# Database Configuration:
# If MYSQL_URL or DATABASE_URL is provided in cloud environment, it connects to MySQL.
# Otherwise, it falls back to an embedded file database so it never crashes on startup.
spring.datasource.url=${MYSQL_URL:${DATABASE_URL:jdbc:h2:file:./data/jobportaldb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
spring.datasource.username=${MYSQL_USER:${DATABASE_USER:sa}}
spring.datasource.password=${MYSQL_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Port
server.port=${PORT:8080}

# Logging Configuration
logging.level.org.springframework=INFO

# Disable default security auto-user
spring.security.user.name=disable
spring.security.user.password=disable

# Multipart / File Upload (for Resume uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
info.app.name=JobApplication
info.app.description=Job App by Chhavi Dubey
info.app.version=1.0.0
management.info.env.enabled=true